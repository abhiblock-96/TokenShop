[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/","@chainlink/contracts/=lib/chainlink-evm/contracts/src/v0.8/"]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[Fuzz]
runs = 1000

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
